services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: documate
      POSTGRES_USER: documate
      POSTGRES_PASSWORD: documate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data:
